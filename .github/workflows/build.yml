name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write   # para publicar el APK en la release «latest»
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # el versionCode usa el nº de commits
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (núcleo)
        run: ./gradlew :core:test
      - name: APK debug + release
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Nombre estable del APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GTA-Vehicle-Viewer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      - name: Publicar en la release «latest» (enlace fijo de descarga)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GTA Vehicle Viewer (última versión)
          body: "APK firmado con la clave compartida del proyecto: se instala encima de la versión anterior sin desinstalar y conserva el catálogo. Commit ${{ github.sha }}."
          files: dist/GTA-Vehicle-Viewer.apk
          make_latest: true
          target_commitish: ${{ github.sha }}
